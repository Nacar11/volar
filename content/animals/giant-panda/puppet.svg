<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- A giant panda in side profile, facing right. Flat shapes, no outlines:
       white and two blacks, with a slightly lighter black for the near legs. -->
  <g id="puppet">
    <g id="animal">
      <ellipse id="shadow" cx="200" cy="336" rx="140" ry="11" fill="#000000" opacity="0.13"/>

      <!-- Far legs, darkest, mostly hidden behind the body and near legs. -->
      <g id="leg-bl">
        <path d="M108 238C128 232 150 242 152 262C154 282 146 300 142 318C142 328 136 334 126 334L112 334C104 334 102 326 106 318C109 300 98 284 94 266C91 250 96 241 108 238Z" fill="#111111"/>
      </g>
      <g id="leg-fl">
        <path d="M250 238C268 235 280 245 280 262L278 314C280 326 276 334 264 334L250 334C241 334 239 326 243 318L245 270C243 252 242 240 250 238Z" fill="#111111"/>
      </g>

      <circle id="tail" cx="84" cy="232" r="11" fill="#F7F7F5"/>

      <g id="body">
        <!-- White body: round rump, a gentle rise to the shoulders, a soft belly. -->
        <path d="M84 248C80 208 112 188 154 186C200 184 240 186 270 194C290 200 300 214 300 236C300 270 286 296 238 300C190 304 130 302 104 288C90 280 86 266 84 248Z" fill="#F7F7F5"/>
        <!-- The black saddle over the shoulders, running down into the front legs. -->
        <path d="M226 192C250 184 278 188 292 204C302 218 304 240 302 262L300 292C282 300 256 298 240 290C234 262 226 226 226 192Z" fill="#1C1C1C"/>
      </g>

      <!-- Near legs: black haunch at the back, a sturdy pillar at the front. -->
      <g id="leg-br">
        <path d="M128 230C152 224 180 238 182 262C184 284 174 302 170 320C170 330 164 336 152 336L136 336C127 336 125 328 129 320C133 302 120 286 116 268C111 248 115 234 128 230Z" fill="#262626"/>
        <ellipse cx="149" cy="333" rx="16" ry="4.5" fill="#161616"/>
      </g>
      <g id="leg-fr">
        <path d="M272 236C292 232 306 243 306 262L304 314C306 326 302 336 290 336L274 336C264 336 262 328 266 320L268 272C266 254 264 239 272 236Z" fill="#262626"/>
        <ellipse cx="286" cy="333" rx="15" ry="4.5" fill="#161616"/>
        <!-- The pseudo-thumb: a wrist bone for gripping bamboo, only seen through the x-ray lens. -->
        <g id="thumb" style="opacity: var(--xray-show, 0)" fill="#F5E6B8">
          <ellipse cx="300" cy="314" rx="9" ry="4.5" transform="rotate(-20 300 314)"/>
          <circle cx="308" cy="310" r="4"/>
        </g>
      </g>

      <g id="head">
        <!-- Ears first, so the head covers their lower half. The far ear sits a
             little forward and lower, peeking out behind the near one. -->
        <circle cx="330" cy="150" r="13" fill="#111111"/>
        <circle cx="300" cy="150" r="17" fill="#1C1C1C"/>
        <!-- Head and muzzle, one white silhouette. -->
        <ellipse cx="318" cy="188" rx="46" ry="42" fill="#F7F7F5"/>
        <ellipse cx="354" cy="205" rx="24" ry="16" fill="#F7F7F5"/>
        <!-- Inside of the mouth: exactly the jaw's shape, drawn over the muzzle and
             under the jaw, so it shows only where the jaw swings away. -->
        <path id="mouth" d="M328 212C342 215 360 216 374 212C372 218 364 222 354 222C342 222 332 218 328 212Z" fill="#6D2C2C"/>
        <!-- The lower jaw: the same white as the muzzle, so it disappears when closed. -->
        <path id="jaw" d="M328 212C342 215 360 216 374 212C372 218 364 222 354 222C342 222 332 218 328 212Z" fill="#F7F7F5"/>
        <!-- One teardrop eye patch, slanting down toward the nose. -->
        <ellipse cx="335" cy="185" rx="11" ry="16" transform="rotate(-38 335 185)" fill="#1C1C1C"/>
        <ellipse cx="376" cy="200" rx="6.5" ry="5" fill="#141414"/>
        <path d="M375 205Q371 212 362 211" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round"/>
        <g id="eye">
          <circle cx="339" cy="180" r="4.5" fill="#FFFFFF"/>
          <circle cx="340" cy="180" r="2.8" fill="#111111"/>
          <circle cx="341.2" cy="178.8" r="1" fill="#FFFFFF"/>
          <ellipse id="lid" cx="339" cy="180" rx="5.5" ry="5.5" fill="#1C1C1C"/>
        </g>
      </g>
    </g>
  </g>
</svg>
