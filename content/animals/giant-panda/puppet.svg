<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g id="puppet">
    <g id="animal">
      <ellipse id="shadow" cx="205" cy="334" rx="150" ry="12" fill="#000000" opacity="0.12"/>
      <circle id="tail" cx="92" cy="224" r="11" fill="#F5F5F5"/>
      <g id="leg-bl">
        <rect x="112" y="236" width="28" height="92" rx="13" fill="#1B1B1B"/>
        <ellipse cx="128" cy="328" rx="19" ry="8" fill="#111111"/>
      </g>
      <g id="leg-fl">
        <rect x="250" y="240" width="28" height="88" rx="13" fill="#1B1B1B"/>
        <ellipse cx="266" cy="328" rx="19" ry="8" fill="#111111"/>
      </g>
      <g id="body">
        <ellipse cx="192" cy="244" rx="108" ry="56" fill="#F5F5F5"/>
        <!-- The black band over the shoulders. -->
        <path d="M232 194C260 186 288 198 296 222L296 282C272 296 248 294 232 286Z" fill="#1B1B1B"/>
      </g>
      <g id="leg-br">
        <rect x="134" y="240" width="30" height="88" rx="14" fill="#262626"/>
        <ellipse cx="152" cy="328" rx="20" ry="8" fill="#161616"/>
      </g>
      <g id="leg-fr">
        <rect x="270" y="244" width="30" height="84" rx="14" fill="#262626"/>
        <ellipse cx="290" cy="328" rx="20" ry="8" fill="#161616"/>
        <!-- The pseudo-thumb: a wrist bone for gripping bamboo, only seen through the x-ray lens. -->
        <g id="thumb" style="opacity: var(--xray-show, 0)" fill="#F5E6B8">
          <ellipse cx="296" cy="312" rx="9" ry="4.5" transform="rotate(-20 296 312)"/>
          <circle cx="304" cy="308" r="4"/>
        </g>
      </g>
      <g id="head">
        <circle cx="292" cy="148" r="17" fill="#1B1B1B"/>
        <circle cx="340" cy="146" r="16" fill="#1B1B1B"/>
        <circle cx="318" cy="190" r="47" fill="#F5F5F5"/>
        <ellipse id="mouth" cx="344" cy="224" rx="12" ry="6" fill="#5D1F1F"/>
        <path id="jaw" d="M324 214C336 218 352 218 360 214C358 226 346 232 334 230C328 228 324 222 324 214Z" fill="#E8E8E8"/>
        <ellipse cx="348" cy="208" rx="19" ry="14" fill="#FFFFFF"/>
        <ellipse cx="362" cy="200" rx="7" ry="5" fill="#111111"/>
        <ellipse cx="330" cy="182" rx="13" ry="18" transform="rotate(-25 330 182)" fill="#1B1B1B"/>
        <g id="eye">
          <circle cx="333" cy="180" r="5" fill="#FFFFFF"/>
          <circle cx="334" cy="180" r="3" fill="#111111"/>
          <ellipse id="lid" cx="333" cy="180" rx="6" ry="6" fill="#1B1B1B"/>
        </g>
      </g>
    </g>
