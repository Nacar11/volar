<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- A cute giant panda in side profile, facing right: a big round head, a
       chubby body, big sparkly eyes and rosy cheeks. Flat shapes, no outlines. -->
  <g id="puppet">
    <g id="animal">
      <ellipse id="shadow" cx="198" cy="336" rx="132" ry="11" fill="#000000" opacity="0.13"/>

      <!-- Far legs, darkest, mostly hidden. -->
      <g id="leg-bl">
        <path d="M110 244C130 238 152 248 152 268L150 318C150 330 142 336 130 336L116 336C106 336 102 328 104 318L102 270C100 256 102 247 110 244Z" fill="#111111"/>
      </g>
      <g id="leg-fl">
        <path d="M250 244C268 240 282 250 282 268L280 318C280 330 274 336 262 336L250 336C240 336 238 328 240 318L242 272C240 256 242 246 250 244Z" fill="#111111"/>
      </g>

      <circle id="tail" cx="92" cy="236" r="12" fill="#F7F7F5"/>

      <g id="body">
        <!-- A chubby, round body. -->
        <path d="M92 250C88 210 118 192 158 190C204 188 244 192 268 200C290 208 300 226 298 248C296 282 276 302 232 304C186 306 132 304 108 290C96 282 92 268 92 250Z" fill="#F7F7F5"/>
        <!-- The black saddle over the shoulders, running down into the front legs. -->
        <path d="M228 194C250 188 276 192 290 206C300 218 302 240 300 262L298 296C280 304 256 302 240 294C234 266 226 228 228 194Z" fill="#1C1C1C"/>
      </g>

      <!-- Near legs: short and sturdy, with rounded paws. -->
      <g id="leg-br">
        <path d="M128 234C154 228 182 242 182 266L180 316C180 330 170 338 156 338L136 338C124 338 120 330 122 318L118 274C114 252 116 238 128 234Z" fill="#262626"/>
      </g>
      <g id="leg-fr">
        <path d="M272 240C292 236 306 248 306 266L304 318C304 330 296 338 284 338L272 338C260 338 258 330 260 318L264 274C262 258 264 243 272 240Z" fill="#262626"/>
        <!-- Toe beans. -->
        <g fill="#4A4A4A">
          <circle cx="272" cy="334" r="2.6"/><circle cx="282" cy="335" r="2.6"/><circle cx="292" cy="334" r="2.6"/>
        </g>
        <!-- The pseudo-thumb: a wrist bone for gripping bamboo, only seen through the x-ray lens. -->
        <g id="thumb" style="opacity: var(--xray-show, 0)" fill="#F5E6B8">
          <ellipse cx="298" cy="316" rx="9" ry="4.5" transform="rotate(-20 298 316)"/>
          <circle cx="306" cy="312" r="4"/>
        </g>
      </g>

      <g id="head">
        <!-- Ears first, so the head covers their lower half; the far ear peeks out behind. -->
        <circle cx="334" cy="136" r="15" fill="#111111"/>
        <circle cx="290" cy="140" r="19" fill="#1C1C1C"/>
        <!-- Inside of the mouth, right under the smile, hidden until the jaw opens. -->
        <ellipse id="mouth" cx="364" cy="214" rx="11" ry="4" fill="#C2185B"/>
        <!-- The lower jaw: the same white as the muzzle, so it disappears when closed. -->
        <path id="jaw" d="M326 212C342 216 362 217 378 212C376 222 366 228 354 228C340 228 330 222 326 212Z" fill="#F7F7F5"/>
        <!-- A big round head and a soft muzzle, one white silhouette. -->
        <ellipse cx="318" cy="180" rx="54" ry="50" fill="#F7F7F5"/>
        <ellipse cx="360" cy="202" rx="22" ry="16" fill="#F7F7F5"/>
        <!-- Rosy cheek. -->
        <ellipse cx="340" cy="208" rx="10" ry="6" fill="#F8BBD0"/>
        <!-- Eye patch, slanting down toward the nose. -->
        <ellipse cx="337" cy="176" rx="14" ry="18" transform="rotate(-30 337 176)" fill="#1C1C1C"/>
        <!-- The nose at the tip of the muzzle, and the mouth straight under it:
             a short line down, then a little smile. -->
        <ellipse cx="378" cy="196" rx="7.5" ry="5.5" fill="#141414"/>
        <ellipse cx="376" cy="194" rx="2.5" ry="1.4" fill="#5A5A5A"/>
        <path d="M377 201.5L377 204.5Q374 210.5 367 207.5" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="eye">
          <circle cx="341" cy="173" r="6.5" fill="#FFFFFF"/>
          <circle cx="342" cy="174" r="4.6" fill="#111111"/>
          <circle cx="343.8" cy="171.8" r="1.8" fill="#FFFFFF"/>
          <circle cx="340.4" cy="176.2" r="0.9" fill="#FFFFFF"/>
          <ellipse id="lid" cx="341" cy="173" rx="7.5" ry="7.5" fill="#1C1C1C"/>
        </g>
      </g>
    </g>
  </g>
</svg>
